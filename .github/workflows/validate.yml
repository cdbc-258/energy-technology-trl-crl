name: Validate assessment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-nmf500.txt pytest
      - run: python -m pytest -q
      - run: python -m trl_crl build --output /tmp/trl-crl-rebuild
      - run: python -m trl_crl validate --output /tmp/trl-crl-rebuild
      - run: python pipelines/nmf500/replay.py --output /tmp/trl-nmf500
